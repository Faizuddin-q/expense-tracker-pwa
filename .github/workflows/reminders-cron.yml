# Free 15-minute reminder scheduler for Vercel Hobby.
# Hobby cannot run cron more than once per day per job, so GitHub Actions
# calls the production cron route every 15 minutes instead.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET     - same value as Vercel CRON_SECRET
#   CRON_APP_URL    - production origin only, no quotes/path
#                     e.g. https://expense-tracker-personal-lemon.vercel.app
name: Reminders cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_APP_URL: ${{ secrets.CRON_APP_URL }}
        run: |
          set -euo pipefail

          # Trim whitespace / accidental wrapping quotes from secret values
          CRON_SECRET="$(printf '%s' "${CRON_SECRET:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          CRON_APP_URL="$(printf '%s' "${CRON_APP_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

          if [ -z "${CRON_SECRET}" ] || [ -z "${CRON_APP_URL}" ]; then
            echo "::error::Missing CRON_SECRET or CRON_APP_URL. Add both under Settings → Secrets → Actions."
            exit 1
          fi

          # Origin only (strip trailing slash / accidental path)
          origin="${CRON_APP_URL%/}"
          origin="${origin%/api/cron/reminders}"
          origin="${origin%/api/cron/reminders/}"

          case "$origin" in
            https://*|http://*) ;;
            *)
              echo "::error::CRON_APP_URL must start with https:// (got length ${#CRON_APP_URL}). Example: https://expense-tracker-personal-lemon.vercel.app"
              exit 1
              ;;
          esac

          url="${origin}/api/cron/reminders"
          echo "Calling host: $(printf '%s' "$origin" | sed -E 's#https?://##')"

          code=$(curl -sS --fail-with-body -o /tmp/cron-body.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url" || true)

          echo "HTTP ${code:-000}"
          cat /tmp/cron-body.json 2>/dev/null || true
          echo

          if [ "${code:-}" != "200" ]; then
            echo "::error::Cron endpoint did not return 200. Check CRON_SECRET matches Vercel and the app is deployed."
            exit 1
          fi
