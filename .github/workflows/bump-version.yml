name: Bump version on release

# Fires whenever main gets new commits — i.e. whenever a branch is merged
# into main. Bumps the patch version in package.json (0.0.1 -> 0.0.2 -> ...)
# and pushes the bump back to main. The commit includes [skip ci] so this
# push doesn't retrigger the workflow (avoids an infinite loop).
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.version }}"

      # Without this, dev keeps showing the pre-bump version after every
      # release, since the bump commit only ever lands on main.
      - name: Sync the version bump back to dev
        continue-on-error: true
        run: |
          if git ls-remote --exit-code --heads origin dev > /dev/null 2>&1; then
            git fetch origin dev
            git checkout -B dev origin/dev
            git merge origin/main --no-edit -m "chore: sync version bump from main [skip ci]"
            git push origin dev
          else
            echo "No dev branch on origin — skipping sync."
          fi
